{% extends "base.html" %}{% block content %}<h1>Editar empleado</h1><form method="post" class="card"><label>Código del reloj<input name="codigo" required value="{{emp.codigo if emp else ''}}" {{'readonly' if emp else ''}}></label><label>Nombre<input name="nombre" required value="{{emp.nombre if emp else ''}}"></label><label>Departamento<input name="departamento" value="{{emp.departamento if emp else ''}}"></label><label>Horario<select name="horario_id"><option value="">Sin horario</option>{% for h in horarios %}<option value="{{h.id}}" {{'selected' if emp and emp.horario_id==h.id else ''}}>{{h.nombre}}</option>{% endfor %}</select></label><label>Activo<input type="checkbox" name="activo" {{'checked' if not emp or emp.activo else ''}}></label><button>Guardar</button></form>{% endblock %}
