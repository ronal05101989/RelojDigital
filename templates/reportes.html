{% extends "base.html" %}{% block content %}<h1>Reportes de asistencia</h1><form class="card"><label>Desde<input type="date" name="desde" value="{{desde}}" required></label><label>Hasta<input type="date" name="hasta" value="{{hasta}}" required></label><label>Empleado<select name="codigo"><option value="">Todos</option>{% for e in emps %}<option value="{{e.codigo}}" {{'selected' if codigo==e.codigo else ''}}>{{e.codigo}} · {{e.nombre}}</option>{% endfor %}</select></label><label>Departamento<select name="departamento"><option value="">Todos</option>{% for d in deptos %}<option {{'selected' if depto==d else ''}}>{{d}}</option>{% endfor %}</select></label><label>Reporte<select name="tipo">{% for k,v in REPORTES.items() %}<option value="{{k}}" {{'selected' if tipo==k else ''}}>{{v}}</option>{% endfor %}</select></label><button>Visualizar</button><button formaction="{{url_for('reporte_excel')}}">Descargar Excel</button><button formaction="{{url_for('reporte_excel')}}" name="todos" value="1">Descargar todos</button></form><p>{{total}}</p><div class="scroll"><table><tr>{% for c in columnas %}<th>{{c[0]}}</th>{% endfor %}</tr>{% for d in datos %}<tr>{% for c in columnas %}<td>{{c[1](d)}}</td>{% endfor %}</tr>{% else %}<tr><td colspan="20">Sin resultados para los filtros seleccionados.</td></tr>{% endfor %}</table></div>{% endblock %}
