{% extends "base.html" %}{% block content %}<h1>Marcajes de entrada y salida</h1><form class="card"><label>Desde<input type="date" name="desde" value="{{desde}}" required></label><label>Hasta<input type="date" name="hasta" value="{{hasta}}" required></label><label>Empleado<select name="codigo"><option value="">Todos</option>{% for e in emps %}<option value="{{e.codigo}}" {{'selected' if codigo==e.codigo else ''}}>{{e.codigo}} · {{e.nombre}}</option>{% endfor %}</select></label><button>Filtrar</button></form><details><summary>Agregar marcaje manual</summary><form class="card" method="post" action="{{url_for('nuevo_marcaje')}}"><label>Empleado<select name="codigo"><option value="">Todos</option>{% for e in emps %}<option value="{{e.codigo}}" {{'selected' if codigo==e.codigo else ''}}>{{e.codigo}} · {{e.nombre}}</option>{% endfor %}</select></label><label>Fecha<input name="fecha" type="date" required></label><label>Hora<input name="hora" type="time" required></label><label>Motivo<input name="nota" required></label><button>Guardar marcaje</button></form></details><div class="scroll"><table><tr><th>Empleado</th><th>Fecha y hora</th><th>Origen</th><th>Nota</th><th></th></tr>{% for m in lista %}<tr><td>{{m.codigo}} · {{m.nombre}}</td><td>{{m.fecha_hora}}</td><td>{{m.origen}}</td><td>{{m.nota}}</td><td><form method="post" action="{{url_for('borrar_marcaje',id=m.id)}}" onsubmit="return confirm('¿Eliminar marcaje?')"><button>Eliminar</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
