{% extends "base.html" %}{% block content %}<h1>Empleados</h1><form class="card"><input name="q" value="{{q}}" placeholder="Nombre, código o departamento"><button>Buscar</button> <a href="{{url_for('empleado',codigo='nuevo')}}">Agregar empleado</a></form><form method="post" action="{{url_for('horario_masivo')}}"><label>Asignar horario<select name="horario_id">{% for h in horarios %}<option value="{{h.id}}">{{h.nombre}}</option>{% endfor %}</select></label><button>Asignar a seleccionados</button><div class="scroll"><table><tr><th>Elegir</th><th>Código</th><th>Nombre</th><th>Departamento</th><th>Horario</th><th>Activo</th></tr>{% for e in lista %}<tr><td><input type="checkbox" name="codigos" value="{{e.codigo}}"></td><td>{{e.codigo}}</td><td><a href="{{url_for('empleado',codigo=e.codigo)}}">{{e.nombre}}</a></td><td>{{e.departamento}}</td><td>{{e.horario or 'Sin horario'}}</td><td>{{'Sí' if e.activo else 'No'}}</td></tr>{% endfor %}</table></div></form>{% endblock %}
